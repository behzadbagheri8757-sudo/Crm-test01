<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تنظیمات — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="./css/app.css">

</head>
<body>
<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="./js/models.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/db.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/stock.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/nav.js"></script>


<script>

bootPage('settings', function(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <h2 class="section-title">تنظیمات و بکاپ</h2>
    <div class="cards">
      <div class="card wide"><div class="label">پایگاه داده</div><div class="value" style="font-size:.95rem;">baqeriDB / appdata / main</div></div>
      <div class="card"><div class="label">schemaVersion</div><div class="value">${data.schemaVersion||'—'}</div></div>
      <div class="card"><div class="label">سری فاکتور</div><div class="value">${data.invoiceSeq||'—'}</div></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="export-json">دانلود بکاپ (JSON)</button>
      <button class="btn secondary" id="export-excel">خروجی اکسل</button>
    </div>
    <h3 class="sub-title">بازیابی از فایل</h3>
    <div class="field"><input type="file" id="import-file" accept="application/json"></div>
    <div class="btn-row">
      <button class="btn danger" id="do-import">بازیابی و جایگزینی</button>
      <button class="btn secondary" id="undo-import">برگشت از آخرین بازیابی</button>
    </div>
    <div class="page-skeleton-note">Backup/Restore همان توابع مرحله ۰ است؛ بدون تغییر منطق.</div>
  `;
  document.getElementById('export-json').onclick = () => exportBackupJSON();
  document.getElementById('export-excel').onclick = () => exportExcel();
  document.getElementById('do-import').onclick = async () => {
    const f = document.getElementById('import-file').files[0];
    if(!f){ showToast('فایل را انتخاب کنید'); return; }
    await importBackupJSON(f);
    location.reload();
  };
  document.getElementById('undo-import').onclick = async () => {
    await undoLastRestore();
    location.reload();
  };
});

</script>
</body>
</html>
