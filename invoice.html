<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>فاکتور — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="./css/app.css">

</head>
<body>
<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="./js/models.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/db.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/stock.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/nav.js"></script>


<script>

bootPage('invoices', function(){
  const main = document.getElementById('main');
  const id = getQueryParam('id');
  if(!id){
    main.innerHTML = `<div class="empty">شناسه فاکتور مشخص نشده.</div>
      <div class="btn-row"><a class="btn secondary" href="./invoices.html">بازگشت</a></div>`;
    return;
  }
  const inv = data.invoices.find(x => x.id === id);
  if(!inv){
    main.innerHTML = `<div class="empty">فاکتور پیدا نشد.</div>
      <div class="btn-row"><a class="btn secondary" href="./invoices.html">بازگشت</a></div>`;
    return;
  }
  const cust = data.customers.find(c => c.id === inv.customerId);
  main.innerHTML = `
    <div class="btn-row" style="margin-bottom:8px;"><a class="btn secondary small" href="./invoices.html">→ فاکتورها</a></div>
    <h2 class="section-title">فاکتور #${esc(String(inv.number||''))}</h2>
    <div class="cards">
      <div class="card"><div class="label">مشتری</div><div class="value" style="font-size:1rem;">${esc(cust?cust.name:'—')}</div></div>
      <div class="card"><div class="label">تاریخ</div><div class="value" style="font-size:1rem;">${faDate(inv.date)}</div></div>
      <div class="card wide"><div class="label">مبلغ</div><div class="value">${toman(inv.total)} ت</div></div>
    </div>
    <div class="page-skeleton-note">جزئیات کامل اقلام و چاپ در مراحل بعد.</div>
  `;
});

</script>
</body>
</html>
