<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تامین‌کننده — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="./css/app.css">

</head>
<body>
<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="./js/models.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/db.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/stock.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/nav.js"></script>


<script>

bootPage('suppliers', function(){
  const main = document.getElementById('main');
  const id = getQueryParam('id');
  if(!id){
    main.innerHTML = `<div class="empty">شناسه تامین‌کننده مشخص نشده.</div>
      <div class="btn-row"><a class="btn secondary" href="./suppliers.html">بازگشت</a></div>`;
    return;
  }
  const s = data.suppliers.find(x => x.id === id);
  if(!s){
    main.innerHTML = `<div class="empty">تامین‌کننده پیدا نشد.</div>
      <div class="btn-row"><a class="btn secondary" href="./suppliers.html">بازگشت</a></div>`;
    return;
  }
  const t = supplierTotals(s.id);
  const st = balanceStatusText(t.balance, toman(Math.abs(t.balance))+' ت');
  const color = t.balance>0 ? 'accent-rust' : (t.balance<0 ? 'accent-olive' : 'accent-olive');
  main.innerHTML = `
    <div class="btn-row" style="margin-bottom:8px;">
      <a class="btn secondary small" href="./suppliers.html">→ لیست تامین‌کننده‌ها</a>
    </div>
    <h2 class="section-title">${esc(s.name)}</h2>
    <div class="cards">
      <div class="card wide"><div class="label">مانده حساب</div><div class="value ${color}">${st}</div></div>
      <div class="card"><div class="label">جمع خرید</div><div class="value">${toman(t.purchaseTotal)} ت</div></div>
      <div class="card"><div class="label">پرداخت‌ها</div><div class="value">${toman(t.payTotal)} ت</div></div>
      <div class="card"><div class="label">برگشت از خرید</div><div class="value">${toman(t.returnTotal)} ت</div></div>
      <div class="card"><div class="label">مانده اولیه</div><div class="value">${toman(t.openingBalance)} ت</div></div>
    </div>
    <div class="card"><div class="label">تلفن</div><div class="value" style="font-size:1rem;">${esc(s.phone||'—')}</div></div>
    <div class="page-skeleton-note">صفحه تامین‌کننده — مرحله ۱: مانده با supplierTotals. جزئیات خرید در مراحل بعد.</div>
  `;
});

</script>
</body>
</html>
