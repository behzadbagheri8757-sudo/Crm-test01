<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اجناس — حبوبات و خشکبار باقری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="./css/app.css">

</head>
<body>
<header>
  <h1>حبوبات و خشکبار باقری</h1>
  <p>دفتر حساب — فروش، مشتریان، انبار، تامین‌کننده‌ها</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<button class="fab" id="fab" style="display:none;">+</button>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script src="./js/models.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/db.js"></script>
<script src="./js/calc.js"></script>
<script src="./js/stock.js"></script>
<script src="./js/payments.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/nav.js"></script>


<script>

bootPage('products', function(){
  const main = document.getElementById('main');
  const list = data.products.slice().sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'fa'));
  if(!list.length){
    main.innerHTML = pageShellNote('اجناس', 'هنوز کالایی ثبت نشده است.');
    return;
  }
  main.innerHTML = `
    <h2 class="section-title">اجناس (${list.length})</h2>
    ${list.map(p => `
      <div class="ledger-row">
        <span class="name">${esc(p.name)}<span class="sub">${esc(p.category||'')} — خرید: ${toman(p.buy)} / فروش: ${toman(p.retail||p.sell||0)}</span></span>
        <span class="filler"></span>
        <span class="amount">موجودی: ${p.stockQty||0}</span>
      </div>
    `).join('')}
    <div class="page-skeleton-note">اسکلت اجناس — ویرایش و افزودن در مراحل بعد از همان منطق فعلی منتقل می‌شود.</div>
  `;
});

</script>
</body>
</html>
